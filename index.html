<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Hello,World</title>
    <style>
        .container{
            display: flex;
            flex-direction: row;
            justify-content: space-around;
            background-color: lightcyan;
            padding: 10px;
        }
        .box{
            width: 70px;
            height: 70px;
            background: tomato;
            margin: 5px;
            padding: 10px;
        }
        h1{
            font-family: Arial, Helvetica, sans-serif;
        }
        body{
            background-color: beige;
        }
    </style>
</head>
<body>
    <h1>Flex box</h1>
    <div class="container">
<div class="box">1</div>
<div class="box">2</div>
 <div class="box">3</div>       
    </div>
</body>
</html>
