<main class="content">


<h1 class="dashboard-title">
Savings
</h1>




<div class="saving-card">


<div class="saving-icon">

<i class="fa-solid fa-piggy-bank"></i>

</div>


<div>

<h3>Total Savings</h3>

<h2>$12,500</h2>

<p>Your saved money</p>

</div>


</div>







<div class="saving-section">


<div class="section-header">

<h2>Saving Goals</h2>


<button id="addGoalBtn" type="button">
Add Goal
</button>


</div>





<div id="goalsList">


<div class="goal">

<div class="goal-top">

<h3>New Laptop</h3>

<span>$800 / $1500</span>

</div>


<div class="goal-bar">

<div class="laptop-progress"></div>

</div>

</div>



</div>


</div>


</main>


</div>







<div class="goal-popup" id="goalPopup">


<div class="popup-box">


<h2>Add New Goal</h2>


<input type="text" id="goalName" placeholder="Goal Name">


<input type="number" id="goalAmount" placeholder="Target Amount">


<button id="createGoalBtn" type="button">
Create Goal
</button>


<button id="closeGoalBtn" type="button">
Cancel
</button>


</div>

</div>







<script>


const addGoalBtn = document.getElementById("addGoalBtn");

const popup = document.getElementById("goalPopup");

const createBtn = document.getElementById("createGoalBtn");

const closeBtn = document.getElementById("closeGoalBtn");

const goalsList = document.getElementById("goalsList");



addGoalBtn.onclick = function(){

popup.style.display = "flex";

};



closeBtn.onclick = function(){

popup.style.display = "none";

};





createBtn.onclick = function(){


let name = document.getElementById("goalName").value.trim();

let amount = document.getElementById("goalAmount").value.trim();



if(name === "" || amount === ""){

alert("Please fill all details");

return;

}




let goal = document.createElement("div");

goal.className = "goal";



goal.innerHTML = `

<div class="goal-top">

<h3>${name}</h3>

<span>$0 / $${amount}</span>

</div>


<div class="goal-bar">

<div class="laptop-progress"></div>

</div>

`;



goalsList.appendChild(goal);



document.getElementById("goalName").value = "";

document.getElementById("goalAmount").value = "";



popup.style.display = "none";


};



</script>
