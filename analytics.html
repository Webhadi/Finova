<header class="navbar">

    <div class="logo">
        <h2>💰 Finova</h2>
    </div>


    <div class="search-box">
        <input type="text" placeholder="Search...">
    </div>


    <div class="nav-icons">

        <span class="icon">🔔</span>

        <span class="icon">🌙</span>


        <div class="profile">

            <img src="business-avatar-profile-black-icon-man-of-user-symbol-in-trendy-flat-style-isolated-on-male-profile-people-diverse-face-for-social-network-or-web-vector.jpg">

            <span>Abdul</span>

        </div>


    </div>

</header>






<div class="container">



<!-- SIDEBAR -->

<aside class="sidebar">


<a href="dashboard.html">
<i class="fa-solid fa-chart-line"></i>
<span>Dashboard</span>
</a>



<a href="transaction.html">
<i class="fa-solid fa-wallet"></i>
<span>Transactions</span>
</a>



<a href="analytics.html" class="active">
<i class="fa-solid fa-chart-pie"></i>
<span>Analytics</span>
</a>



<a href="budget.html">
<i class="fa-solid fa-bullseye"></i>
<span>Budget</span>
</a>



<a href="savings.html">
<i class="fa-solid fa-piggy-bank"></i>
<span>Savings</span>
</a>



<a href="bills.html">
<i class="fa-solid fa-calendar-days"></i>
<span>Bills</span>
</a>



<a href="profile.html">
<i class="fa-solid fa-user"></i>
<span>Profile</span>
</a>



<a href="settings.html">
<i class="fa-solid fa-gear"></i>
<span>Settings</span>
</a>


</aside>








<!-- CONTENT -->

<main class="content">


<h1 class="dashboard-title">
Analytics
</h1>




<!-- Summary Cards -->


<div class="cards">


<div class="card balance">

<div class="card-icon">
<i class="fa-solid fa-arrow-up"></i>
</div>


<div class="card-info">

<h3>Total Income</h3>

<h2>$8,000</h2>

</div>


</div>





<div class="card expense">

<div class="card-icon">
<i class="fa-solid fa-arrow-down"></i>
</div>


<div class="card-info">

<h3>Total Expense</h3>

<h2>$3,200</h2>

</div>


</div>






<div class="card savings">

<div class="card-icon">
<i class="fa-solid fa-percent"></i>
</div>


<div class="card-info">

<h3>Savings Rate</h3>

<h2>60%</h2>

</div>


</div>



</div>








<!-- Chart Section -->


<div class="analytics-box">


<h2>Income vs Expense</h2>


<div class="chart">


<div class="bar income-bar">

<span>Income</span>

</div>


<div class="bar expense-bar">

<span>Expense</span>

</div>


</div>


</div>








<!-- Spending Categories -->


<div class="analytics-box">


<h2>Spending Categories</h2>



<div class="category">


<p>Food</p>

<div class="line">

<div class="food"></div>

</div>

<span>$500</span>

</div>





<div class="category">


<p>Shopping</p>

<div class="line">

<div class="shopping"></div>

</div>

<span>$900</span>

</div>





<div class="category">


<p>Bills</p>

<div class="line">

<div class="bills"></div>

</div>

<span>$700</span>

</div>





</div>





</main>


</div>



</body>
