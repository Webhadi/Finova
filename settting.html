<div class="container">


<aside class="sidebar">

<main class="content">


<h1 class="dashboard-title">
Settings
</h1>





<div class="setting-box">


<h2>
Profile Settings
</h2>


<div class="setting-item">

<p>Name</p>

<input type="text" value="Abdul">

</div>



<div class="setting-item">

<p>Email</p>

<input type="email" value="abdul@email.com">

</div>


</div>







<div class="setting-box">


<h2>
Preferences
</h2>



<div class="setting-row">

<span>
Notifications
</span>


<label class="switch">

<input type="checkbox" checked>

<span class="slider"></span>

</label>


</div>





<div class="setting-row">

<span>
Dark Mode
</span>


<label class="switch">

<input type="checkbox">

<span class="slider"></span>

</label>


</div>


</div>







<div class="setting-box">


<h2>
Security
</h2>


<button class="save-btn">
Change Password
</button>


<button class="logout-btn">
Logout
</button>


</div>
