All Transactions
</h1>

</div>

<script>


const transactions = [

["Salary","+$3000","income"],

["Shopping","-$150","expense"],

["Food","-$50","expense"],

["Freelance Payment","+$1200","income"],

["Internet Bill","-$60","expense"],

["Rent","-$700","expense"],

["Bonus","+$500","income"],

["Gaming","-$100","expense"],

["Electricity Bill","-$90","expense"],

["Investment","+$800","income"],

["Transport","-$40","expense"],

["Coffee","-$15","expense"],

["Online Course","-$200","expense"],

["Business Profit","+$2500","income"]

];



const list = document.getElementById("transactions-list");



for(let i = 0; i < 100; i++){


let item = transactions[i % transactions.length];



list.innerHTML += `


<div class="transaction">


<div class="transaction-icon ${item[2]}-icon">

<i class="fa-solid ${item[2] === "income" ? "fa-arrow-trend-up" : "fa-arrow-trend-down"}"></i>

</div>



<div class="transaction-info">


<h3>${item[0]}</h3>


<p>${i + 1} July 2026</p>


</div>




<strong class="${item[2] === "income" ? "plus" : "minus"}">

${item[1]}

</strong>



</div>


`;

}


</script>
